# Pinned build: arduino-cli compile --profile king_board
default_profile: king_board
profiles:
  king_board:
    # ESP32-S3-WROOM-1-N8R2: 8 MB flash, 2 MB quad PSRAM
    fqbn: esp32:esp32:esp32s3:PSRAM=enabled,FlashSize=8M,PartitionScheme=default_8MB,CDCOnBoot=cdc
    platforms:
      - platform: esp32:esp32 (3.3.10)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ESP32Servo (3.2.1)
      - HX711 (0.6.4)
      - ArduinoJson (7.4.3)
