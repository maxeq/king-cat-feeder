<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>king board</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: monospace; text-align: center; }
  #status { padding: 24px 8px; font-size: 20px; line-height: 1.6; white-space: pre-line; }
  #log { text-align: left; max-width: 640px; margin: 8px auto; background: #000; padding: 8px;
         height: 260px; overflow-y: auto; font-size: 13px; }
  nav { padding: 6px; }
</style>
</head>
<body>
<div id="status">...</div>
<nav>
  <button onclick="fetch('/light?m=on')">LIGHT: ALWAYS</button>
  <button onclick="fetch('/light?m=pir')">LIGHT: on motion</button>
  <a href="/cats">cats</a> · <a href="/cam">camera</a>
</nav>
<pre id="log"></pre>
<script>
  const status = document.getElementById("status");
  const log = document.getElementById("log");
  setInterval(async () => {
    status.textContent = await (await fetch("/status")).text();
    log.textContent = await (await fetch("/log")).text();
    log.scrollTop = log.scrollHeight;
  }, 1000);
</script>
</body>
</html>
